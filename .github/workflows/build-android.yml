name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 🏗 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Create .env file
        run: |
          echo "EXPO_PUBLIC_REVENUECAT_API_KEY=${{ secrets.REVENUECAT_API_KEY }}" > .env

      - name: 🔨 Expo Prebuild (generate native Android project)
        run: npx expo prebuild --platform android --clean

      - name: 🏗 Build Standalone Release APK with Gradle
        working-directory: android
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          EXPO_PUBLIC_REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Pandroid.lint.abortOnError=false -Pandroid.lint.checkReleaseBuilds=false -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease

      - name: 📱 Upload Standalone Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brilliant-wellbeing-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
