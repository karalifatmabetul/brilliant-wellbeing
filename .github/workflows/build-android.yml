name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 🏗 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Create .env file
        run: |
          echo "EXPO_PUBLIC_REVENUECAT_API_KEY=${{ secrets.REVENUECAT_API_KEY }}" > .env

      - name: 🔨 Expo Prebuild (generate native Android project)
        run: npx expo prebuild --platform android --clean

      - name: 🔧 Disable Lint checks
        run: |
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties
          # Disable lint to prevent build failures from lint errors
          cat >> android/app/build.gradle << 'EOF'

          android {
              lintOptions {
                  abortOnError false
                  checkReleaseBuilds false
                  disable 'all'
              }
          }
          EOF

      - name: 🏗 Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -x lint -x lintDebug -x lintVitalAnalyzeDebug -x lintVitalReportDebug

      - name: 📱 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brilliant-wellbeing-android
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
